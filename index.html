<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Literário - Quadro de Detetive</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="atlas-container">
        <!-- Placa superior -->
        <div class="header-plate">
            <span class="header-icon compass-icon"></span>
            <h1>O ATLAS LITERÁRIO</h1>
            <span class="header-icon feather-icon"></span>
        </div>

        <!-- O quadro em si -->
        <div id="board">
            <div id="map"></div>
            <!-- Tooltip HTML (hidden by default) -->
            <div id="tooltip">
                <div id="tooltip-title">Title</div>
                <div id="tooltip-location">Location</div>
            </div>
            <!-- Selo inferior direito -->
            <div class="seal"></div>
        </div>
    </div>

    <!-- Three.js Library and Controls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
