<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Literário - Quadro de Detetive</title>

    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="atlas-container">
        <!-- Placa superior -->
        <div class="header-plate">
            <span class="header-icon compass-icon"></span>
            <h1>O ATLAS LITERÁRIO</h1>
            <span class="header-icon feather-icon"></span>
        </div>

        <!-- O quadro em si -->
        <div id="board">
            <div id="map"></div>
            <!-- Selo inferior direito -->
            <div class="seal"></div>
        </div>
    </div>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
